name: release

# セマンティックな vX.Y.Z タグを push したときに走り、
#   1. 同じ内容で GitHub Release を作成
#   2. メジャー版エイリアス (v1, v2, ...) を最新の vX.Y.Z に貼り直す
# ことで、利用側が `uses: s4na/rails-migration-checker-action@v1` の形で
# 安定して参照できるようにする。

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute major tag
        id: major
        run: |
          full="${GITHUB_REF_NAME}"        # 例: v1.2.3
          major="${full%%.*}"              # 例: v1
          echo "tag=$full"   >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Move major tag to current commit
        env:
          MAJOR: ${{ steps.major.outputs.major }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.major.outputs.tag }}
        run: |
          # 既存リリースがあれば更新、無ければ新規作成（再実行可能にしておく）
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --prerelease=false
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
