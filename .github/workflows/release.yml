name: release

# 完全自動リリース。流れ:
#   1. main に conventional commit (feat:, fix: 等) が push されると
#      release-please が「次のバージョンに上げる release PR」を作成/更新する。
#   2. その release PR をマージすると release-please が
#      vX.Y.Z タグ + GitHub Release を生成する。
#   3. 同 job でメジャー版エイリアス (v1 等) を最新コミットに force-update
#      するので、利用側は `uses: s4na/rails-migration-checker-action@v1`
#      の固定参照だけで自動的に最新メジャーを追随できる。

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          package-name: rails-migration-checker-action

      - name: Checkout (only when a release was created)
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move major tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}     # 例: v1.2.3
          MAJOR: v${{ steps.release.outputs.major }}     # 例: v1
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TAG"
          git push origin "$MAJOR" --force
