name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  minitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Run unit tests
        run: ruby test/schema_diff_test.rb
